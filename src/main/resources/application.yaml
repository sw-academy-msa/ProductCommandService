# 공통 설정은 Product 소유 스키마와 공개키 검증 계약만 정의합니다.
spring:
  # 업무 테이블과 분류를 db/migration의 한 버전 순서로 관리합니다. V1 업무 테이블, V2 분류·점검 기준, V3 분류 확장입니다.
  flyway:
    locations: classpath:db/migration
    default-schema: product
    schemas: product
    create-schemas: true
    # 운영은 빈 DB에서 V1부터 실행하며, 이미 테이블이 있는 DB를 자동으로 기준점 처리하지 않습니다.
    baseline-on-migrate: false
    clean-disabled: true
  application:
    name: product-command-service
  profiles:
    default: local
  # 내부 호출 장애 대응입니다. 상태 확인으로 죽은 인스턴스를 목록에서 미리 빼고, 연결 실패·시간 초과 요청은 다른 인스턴스로 1회 재시도합니다.
  # Product의 내부 호출은 Account 판매자 정보 조회(GET)뿐이라 시간 초과 재시도도 중복 변경을 만들지 않습니다.
  cloud:
    loadbalancer:
      configurations: health-check
      health-check:
        # 메일·DB 같은 외부 연결 검사가 들어간 /actuator/health 대신 인스턴스 기동 여부만 보는 readiness를 씁니다.
        # 전체 health를 10초마다 호출하면 Account의 메일 검사가 SMTP에 반복 로그인해 차단되고 인스턴스가 통째로 제외됩니다.
        path:
          default: /actuator/health/readiness
        interval: 10s
        refetch-instances: true
        refetch-instances-interval: 30s
      retry:
        enabled: true
        retry-on-all-operations: true
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1
        retryable-exceptions: java.net.ConnectException, java.net.SocketTimeoutException
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      # 파일은 권한이 제한된 S3 직접 업로드만 사용하며 MVC multipart 수신은 열지 않습니다.
      enabled: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: product
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 2000
        delivery.timeout.ms: 8000
        request.timeout.ms: 3000
        max.request.size: 4194304
    admin:
      auto-create: false
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  # 외부 전달 헤더를 인증 사용자나 소유권의 근거로 사용하지 않습니다.
  forward-headers-strategy: none
product:
  ai:
    consumer-enabled: ${PRODUCT_AI_CONSUMER_ENABLED:false}
  outbox:
    # 저장은 항상 수행하고 발행만 명시적으로 활성화합니다. 장애 중에도 미발행 이벤트를 보존합니다.
    publisher-enabled: ${PRODUCT_OUTBOX_PUBLISHER_ENABLED:false}
  stock:
    # 서비스 토큰 발급·주체 계약은 Order 연동 때 확정합니다. 미설정 시 내부 HTTP API는 차단합니다.
    order-subject: ${ORDER_SERVICE_SUBJECT:}
  # Account는 Eureka 서비스 ID로만 찾습니다. 고정 주소를 두지 않아 장애 인스턴스를 등록 해제로 우회합니다.
  seller-account:
    # 사용자 토큰을 전달하므로 기본 https입니다. 평문 http는 로컬 프로필에서만 지정합니다.
    scheme: https
    service-id: account-service
  images:
    enabled: ${PRODUCT_IMAGES_ENABLED:false}
    bucket: ${PRODUCT_IMAGES_BUCKET:}
    region: ${PRODUCT_IMAGES_REGION:ap-northeast-2}
    endpoint: ${PRODUCT_IMAGES_ENDPOINT:}
    local: ${PRODUCT_IMAGES_LOCAL:false}
    # 사용자 위임에 따른 이미지 형식과 보수적인 기술 상한이며 운영 설정으로 조정 가능합니다.
    allowed-types: image/jpeg,image/png,image/webp
    max-bytes: ${PRODUCT_IMAGES_MAX_BYTES:10485760}
  auth:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:stockdrop-api}
    jwk-set-uri: ${ACCOUNT_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
eureka:
  client:
    # 구매 Gateway가 복제본을 탐색할 수 있도록 기본 등록을 활성화합니다.
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    hostname: ${SERVICE_HOSTNAME:localhost}
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${SERVICE_INSTANCE_ID:${random.uuid}}
    non-secure-port: ${SERVICE_PORT:${server.port}}
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/health
management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 업무 JWT와 분리된 읽기 전용 수집 토큰입니다. 빈 값이면 메트릭 접근을 거부합니다.
monitoring:
  scrape-token: ${MONITORING_SCRAPE_TOKEN:}

  # Outbox 집계 스케줄은 명시 활성화하며 테스트/미설정 환경에서 DB를 주기 조회하지 않습니다.
  outbox-enabled: ${MONITORING_OUTBOX_ENABLED:false}
